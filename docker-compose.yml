services:
  gateway:
    image: nginxinc/nginx-unprivileged:alpine-slim
    container_name: campushub-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - frontend
      - backend
      - data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: campushub-frontend
    restart: unless-stopped
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  api:
    build:
      context: ./app/api
      dockerfile: Dockerfile
    container_name: campushub-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "${PORT:-3000}"
      PGHOST: "${PGHOST:-db}"
      PGUSER: "${PGUSER:-campus}"
      PGPASSWORD: "${PGPASSWORD:-change-me}"
      PGDATABASE: "${PGDATABASE:-campushub}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-change-me-redis}"
      RABBITMQ_HOST: "${RABBITMQ_HOST:-rabbitmq}"
      RABBITMQ_USER: "${RABBITMQ_USER:-campus}"
      RABBITMQ_PASS: "${RABBITMQ_PASS:-change-me-mq}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-minio}"
      MINIO_PORT: "${MINIO_PORT:-9000}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-change-me-too}"
      MINIO_BUCKET: "${MINIO_BUCKET:-campushub}"
      SMTP_HOST: "${SMTP_HOST:-mailhog}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend
      - data
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ./app/api
      dockerfile: Dockerfile
    container_name: campushub-worker
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    env_file:
      - .env
    environment:
      SMTP_HOST: "${SMTP_HOST:-mailhog}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      RABBITMQ_HOST: "${RABBITMQ_HOST:-rabbitmq}"
      RABBITMQ_USER: "${RABBITMQ_USER:-campus}"
      RABBITMQ_PASS: "${RABBITMQ_PASS:-change-me-mq}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    healthcheck:
      disable: true

  db:
    image: postgres:16-alpine
    container_name: campushub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${PGUSER:-campus}"
      POSTGRES_PASSWORD: "${PGPASSWORD:-change-me}"
      POSTGRES_DB: "${PGDATABASE:-campushub}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-campus} -d ${PGDATABASE:-campushub}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: campushub-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-me-redis}"]
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-change-me-redis} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: campushub-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-campus}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS:-change-me-mq}"
    ports:
      - "127.0.0.1:15672:15672"
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5672 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: campushub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-change-me-too}"
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: campushub-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  data:
    driver: bridge

volumes:
  pgdata:
  miniodata:
