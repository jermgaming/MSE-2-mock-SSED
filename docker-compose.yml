name: campushub

services:
  gateway:
    image: nginxinc/nginx-unprivileged:1.27.4-alpine
    ports:
      - "0.0.0.0:${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 128m

  frontend:
    build: ./app/frontend
    networks: [frontend]
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 192m

  api:
    image: campushub-api:local
    build: ./app/api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [backend, data]
    restart: unless-stopped
    cpus: 1.00
    mem_limit: 384m

  worker:
    image: campushub-api:local
    command: ["node", "src/worker.js"]
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks: [backend]
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 192m

  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped
    cpus: 1.00
    mem_limit: 512m

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [data]
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 192m

  rabbitmq:
    image: rabbitmq:4.0.5-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]
    restart: unless-stopped
    cpus: 1.00
    mem_limit: 512m

  minio:
    image: rustfs/rustfs:1.0.5
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend, data]
    restart: unless-stopped
    cpus: 1.00
    mem_limit: 512m

  mailhog:
    image: mailhog/mailhog:v1.0.1
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "wget -q -O /dev/null http://127.0.0.1:8025/api/v2/messages"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 128m

networks:
  frontend:
  backend:
  data:

volumes:
  postgres_data:
  minio_data:
