
services:
  # 1. Gateway - Only publicly exposed application service
  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "${GATEWAY_PORT}:8080"
    volumes:
      - ./app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 128m

  # 2. Frontend
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    expose:
      - "8080"
    networks:
      - frontend
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 128m

  # 3. API
  api:
    build:
      context: ./app/api
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend
      - data
    restart: unless-stopped
    cpus: "1.00"
    mem_limit: 256m

  # 4. Worker
  worker:
    build:
      context: ./app/api
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["node", "src/worker.js"]
    healthcheck:
      disable: true
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 192m

  # 5. PostgreSQL
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - data
    restart: unless-stopped
    cpus: "0.75"
    mem_limit: 256m

  # 6. Redis
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 128m

  # 7. RabbitMQ
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - backend
    restart: unless-stopped
    cpus: "0.75"
    mem_limit: 384m

  # 8. MinIO
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped
    cpus: "0.75"
    mem_limit: 384m

  # 9. MailHog
  mailhog:
    image: mailhog/mailhog:v1.0.1
    environment:
      MH_STORAGE: memory
    expose:
      - "1025"
    ports:
      - "127.0.0.1:8026:8025"
    networks:
      - backend
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 128m

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  data:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
