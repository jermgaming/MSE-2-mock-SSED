
services:
  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: campushub-gateway
    ports:
      - "${GATEWAY_PORT}:8080"
    volumes:
      - ./app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - frontend
      - backend
      - data
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: campushub-frontend
    networks:
      - frontend
    restart: unless-stopped
    cpus: 1.00
    mem_limit: 256m

  api:
    build:
      context: ./app/api
      dockerfile: Dockerfile
    image: campushub-api:local
    container_name: campushub-api
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend
      - data
    restart: unless-stopped
    cpus: 1.00
    mem_limit: 384m

  worker:
    image: campushub-api:local
    container_name: campushub-worker
    command: ["node", "src/worker.js"]
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - backend
      - data
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 256m
    healthcheck:
      disable: true

  db:
    image: postgres:16-alpine
    container_name: campushub-db
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    restart: unless-stopped
    cpus: 1.00
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: campushub-redis
    env_file:
      - .env
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    networks:
      - data
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: campushub-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "127.0.0.1:15672:15672"
    networks:
      - data
    restart: unless-stopped
    cpus: 1.00
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    container_name: campushub-minio
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - data
    restart: unless-stopped
    cpus: 1.00
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 15s
      timeout: 10s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: campushub-mailhog
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - backend
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  data:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
