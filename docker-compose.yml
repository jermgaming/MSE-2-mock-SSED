services:

  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: campushub-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - frontend
      - backend
      - data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    image: campushub-frontend:latest
    container_name: campushub-frontend
    expose:
      - "8080"
    networks:
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  api:
    build:
      context: ./app/api
      dockerfile: Dockerfile
    image: campushub-api:latest
    container_name: campushub-api
    environment:
      PORT: ${PORT:-3000}

      PGHOST: db
      PGUSER: ${PGUSER:-campus}
      PGPASSWORD: ${PGPASSWORD:-campus_db_2026}
      PGDATABASE: ${PGDATABASE:-campushub}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_2026_password}

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-campus}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-rabbitmq_2026_password}

      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio_2026_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-campushub}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

    networks:
      - backend
      - data

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  worker:
    image: campushub-api:latest
    container_name: campushub-worker
    command: ["node", "src/worker.js"]

    environment:
      PGHOST: db
      PGUSER: ${PGUSER:-campus}
      PGPASSWORD: ${PGPASSWORD:-campus_db_2026}
      PGDATABASE: ${PGDATABASE:-campushub}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_2026_password}

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-campus}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-rabbitmq_2026_password}

      SMTP_HOST: mailhog
      SMTP_PORT: 1025

    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - backend
      - data

    restart: unless-stopped

    healthcheck:
      disable: true

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M

  db:
    image: postgres:17-alpine
    container_name: campushub-db

    environment:
      POSTGRES_USER: ${PGUSER:-campus}
      POSTGRES_PASSWORD: ${PGPASSWORD:-campus_db_2026}
      POSTGRES_DB: ${PGDATABASE:-campushub}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - data

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-campus} -d ${PGDATABASE:-campushub}"]
      interval: 10s
      timeout: 5s
      retries: 5

    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  redis:
    image: redis:7.4-alpine
    container_name: campushub-redis

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-redis_2026_password}

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_2026_password}

    networks:
      - data

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: campushub-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-campus}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-rabbitmq_2026_password}

    networks:
      - data

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 384M

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    container_name: campushub-minio

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_2026_password}

    volumes:
      - minio_data:/data

    networks:
      - data

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 384M

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: campushub-mailhog
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "1025"
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

volumes:
  postgres_data:
  minio_data:


networks:
  frontend:
  backend:
  data: