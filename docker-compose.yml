# CampusHub — nine services, one public entry point.
#
# All configuration comes from .env (see .env.example) through variable
# substitution: this file contains no credentials at all.
#
# Networks (each service is attached only to what it needs):
#   frontend — gateway <-> frontend
#   backend  — gateway <-> api/worker, worker -> mailhog
#   data     — gateway/api/worker <-> db, redis, rabbitmq, minio
#
# Host ports:
#   0.0.0.0:${GATEWAY_PORT}  gateway (the ONLY port on public interfaces)
#   127.0.0.1:15672          RabbitMQ management UI (local screenshots)
#   127.0.0.1:8025           MailHog UI (local screenshots)
#   127.0.0.1:9001           MinIO console (local screenshots)

name: campushub

# Environment shared by the api and worker containers (same image, same code).
x-app-environment: &app-environment
  PORT: ${PORT:-3000}
  PGHOST: ${PGHOST}
  PGUSER: ${PGUSER}
  PGPASSWORD: ${PGPASSWORD}
  PGDATABASE: ${PGDATABASE}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  RABBITMQ_HOST: ${RABBITMQ_HOST}
  RABBITMQ_USER: ${RABBITMQ_USER}
  RABBITMQ_PASS: ${RABBITMQ_PASS}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT}
  MINIO_PORT: ${MINIO_PORT:-9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET:-campushub}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-1025}

services:
  # --------------------------------------------------------------- gateway
  # Nginx reverse proxy, the single public entry point.
  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      - ./app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks: [frontend, backend, data]
    depends_on: [frontend, api, minio]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # -------------------------------------------------------------- frontend
  # Multi-stage build: Node.js builds the React app, unprivileged nginx
  # serves the static files (healthcheck comes from the Dockerfile).
  frontend:
    build:
      context: ./app/frontend
    image: campushub/frontend:1.0.0
    networks: [frontend]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ------------------------------------------------------------------- api
  # Runs migrations + seed on start (npm start), then serves on :3000.
  # Image tag is reused by the worker below.
  api:
    build:
      context: ./app/api
    image: campushub/api:1.0.0
    environment:
      <<: *app-environment
    networks: [backend, data]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  # ---------------------------------------------------------------- worker
  # Same image as the api, different entrypoint. The image-level
  # healthcheck probes an HTTP endpoint the worker does not serve, so it
  # is replaced here with a process-aliveness check.
  worker:
    image: campushub/api:1.0.0
    command: ["node", "src/worker.js"]
    environment:
      <<: *app-environment
    networks: [backend, data]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "pgrep", "-f", "src/worker.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  # -------------------------------------------------------------------- db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  # ----------------------------------------------------------------- redis
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # -------------------------------------------------------------- rabbitmq
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "127.0.0.1:15672:15672"
    networks: [data]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  # ------------------------------------------------------------------ minio
  # MinIO removed its minio/minio image from Docker Hub, so this stack uses
  # the Bitnami-maintained MinIO image (pinned) with the same env contract
  # (MINIO_ROOT_USER / MINIO_ROOT_PASSWORD) and bundled `mc`.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BROWSER: "on"
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/bitnami
    networks: [data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  # --------------------------------------------------------------- mailhog
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:8025:8025"
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8025/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

volumes:
  pgdata:
  minio-data:

networks:
  frontend:
  backend:
  data:
