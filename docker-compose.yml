
services:
  gateway:
    image: nginx:alpine
    ports:
      - "8081:8080"
    volumes:
      - ./app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    networks:
      - backend
      - frontend
      - data
    restart: unless-stopped

    mem_limit: 128m

  frontend:
    build: ./app/frontend
    networks:
      - frontend
    restart: unless-stopped
    mem_limit: 256m

  api:
    build: ./app/api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend
      - data
    restart: unless-stopped
    mem_limit: 512m

  worker:
    build: ./app/api
    command: ["node", "src/worker.js"]
    env_file: .env
    healthcheck:
      disable: true
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
      - data
    restart: unless-stopped
    mem_limit: 256m

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data
    restart: unless-stopped
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data
    restart: unless-stopped
    mem_limit: 128m

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - backend
    restart: unless-stopped
    mem_limit: 256m

  minio:
    image: pgsty/silo:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - data
    restart: unless-stopped
    mem_limit: 256m

  mailhog:
    image: mailhog/mailhog:v1.0.1
    networks:
      - backend
    restart: unless-stopped
    mem_limit: 128m

volumes:
  postgres_data:
  minio_data:

networks:
  frontend:
  backend:
  data: